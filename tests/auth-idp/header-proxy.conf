# Stand-only authenticating-proxy stand-in: the "authenticated" identity comes from the stand cookie
# aiqsa_stand_user (set by the test as the proxy's own login would), and every client-supplied
# identity header is overwritten, as a real proxy must do.
map $cookie_aiqsa_stand_user $stand_email {
  default "";
  "~^[a-z0-9.-]+$" "$cookie_aiqsa_stand_user@proxy.aiqsa.test";
}
map $cookie_aiqsa_stand_groups $stand_groups {
  default "";
  "~^[a-z0-9,-]+$" $cookie_aiqsa_stand_groups;
}
server {
  listen 8088;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Auth-Request-Email $stand_email;
    proxy_set_header X-Auth-Request-User $cookie_aiqsa_stand_user;
    proxy_set_header X-Auth-Request-Groups $stand_groups;
    proxy_buffering off;
  }
}
