name: ${COMPOSE_PROJECT_NAME:?Set a unique disposable source project name}

services:
  app:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap 'exit 0' TERM INT; while :; do sleep 60; done"]
    cpus: 0.25
    mem_limit: 64m
    restart: "no"

  memory-worker:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap 'exit 0' TERM INT; while :; do sleep 60; done"]
    cpus: 0.25
    mem_limit: 64m
    restart: "no"

  migrate-bootstrap:
    image: ${AIQSA_TEST_TOOLS_IMAGE:-aiqsa-dev-app:latest}
    command: ["true"]
    working_dir: /app
    environment:
      AIQSA_ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      AIQSA_LOCAL_DEV_PROFILE_DISABLED: "1"
      AIQSA_MEMORY_FINGERPRINT_KEYRING: ${AIQSA_MEMORY_FINGERPRINT_KEYRING:?Set the disposable Memory keyring}
      AIQSA_TEST_MODE: "1"
      DATABASE_URL: postgresql://aiqsa_test:aiqsa-test-postgres@postgres:5432/aiqsa_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=768
    cpus: 1.0
    mem_limit: 1g
    profiles:
      - tools
    read_only: true
    restart: "no"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    volumes:
      - ${AIQSA_REPOSITORY_ROOT:?Set the repository root}:/app:ro
      - source_tools_node_modules:/app/node_modules

  postgres:
    image: ghcr.io/insciqq/aiqsa-postgres:16.14-pgvector0.8.5@sha256:db8f80686e188be2abf9507d6a20d1cb230d47b1a4c8334cc7f076610b1d20ee
    environment:
      POSTGRES_DB: aiqsa_test
      POSTGRES_PASSWORD: aiqsa-test-postgres
      POSTGRES_USER: aiqsa_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 2s
      retries: 30
    cpus: 1.0
    mem_limit: 768m
    restart: "no"
    volumes:
      - source_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_PASSWORD: aiqsa-test-object-secret
      MINIO_ROOT_USER: aiqsa_test
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 30
    cpus: 0.5
    mem_limit: 512m
    restart: "no"
    volumes:
      - source_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set --quiet source http://minio:9000 "$${S3_ACCESS_KEY_ID}"
        "$${S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "source/$${S3_BUCKET}" >/dev/null
    environment:
      S3_ACCESS_KEY_ID: aiqsa_test
      S3_BUCKET: aiqsa-test-uploads
      S3_ENDPOINT: http://minio:9000
      S3_SECRET_ACCESS_KEY: aiqsa-test-object-secret
    restart: "no"

networks:
  default:
    internal: true

volumes:
  source_minio_data:
  source_postgres_data:
  source_tools_node_modules:
