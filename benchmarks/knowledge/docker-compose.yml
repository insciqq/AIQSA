name: aiqsa-knowledge-benchmark-second

services:
  benchmark-web:
    image: aiqsa-knowledge-benchmark-second-app
    extends:
      file: docker-compose.dev.yml
      service: app
    container_name: aiqsa-knowledge-benchmark-second-web
    profiles: ["answer"]
    # Retained answer runs must not reseed or recreate the imported corpus.
    # Bootstrap/migrations remain an explicit preparation operation.
    command: ["npm", "run", "dev"]
    environment:
      AIQSA_APP_BASE_URL: http://localhost:${AIQSA_KNOWLEDGE_BENCHMARK_APP_PORT:-3147}
      AIQSA_KNOWLEDGE_BENCHMARK_TARGET: public-retrieval
      DATABASE_URL: postgresql://aiqsa_benchmark:aiqsa-knowledge-benchmark-dev-password@postgres:5432/aiqsa_knowledge_benchmark?schema=public
    ports: !override
      - "127.0.0.1:${AIQSA_KNOWLEDGE_BENCHMARK_APP_PORT:-3147}:3000"
    cpus: "2"
    mem_limit: 3g

  benchmark-runner:
    image: aiqsa-knowledge-benchmark-second-app
    extends:
      file: docker-compose.dev.yml
      service: app
    container_name: aiqsa-knowledge-benchmark-second-runner
    command: ["sleep", "infinity"]
    environment:
      AIQSA_KNOWLEDGE_BENCHMARK_TARGET: public-retrieval
      DATABASE_URL: postgresql://aiqsa_benchmark:aiqsa-knowledge-benchmark-dev-password@postgres:5432/aiqsa_knowledge_benchmark?schema=public
    ports: !override []
    cpus: "2"
    mem_limit: 2g
    healthcheck:
      disable: true

  app:
    container_name: aiqsa-knowledge-benchmark-second-app
    environment:
      AIQSA_APP_BASE_URL: http://localhost:${AIQSA_KNOWLEDGE_BENCHMARK_APP_PORT:-3147}
      AIQSA_KNOWLEDGE_BENCHMARK_TARGET: public-retrieval
      DATABASE_URL: postgresql://aiqsa_benchmark:aiqsa-knowledge-benchmark-dev-password@postgres:5432/aiqsa_knowledge_benchmark?schema=public
    ports: !override
      - "127.0.0.1:${AIQSA_KNOWLEDGE_BENCHMARK_APP_PORT:-3147}:3000"

  docling:
    container_name: aiqsa-knowledge-benchmark-second-docling

  knowledge-search-worker:
    environment:
      AIQSA_KNOWLEDGE_SEARCH_PROJECTION_BATCH: "16"
      DATABASE_URL: postgresql://aiqsa_benchmark:aiqsa-knowledge-benchmark-dev-password@postgres:5432/aiqsa_knowledge_benchmark?schema=public

  tika:
    container_name: aiqsa-knowledge-benchmark-second-tika

  toolhive-runtime:
    container_name: aiqsa-knowledge-benchmark-second-toolhive
    profiles: ["benchmark-disabled"]
    user: "65532:65532"
    volumes: !override []

  postgres:
    container_name: aiqsa-knowledge-benchmark-second-postgres
    shm_size: ${AIQSA_KNOWLEDGE_BENCHMARK_POSTGRES_SHM_SIZE:-512m}
    cpus: "3"
    mem_limit: 3g
    environment:
      POSTGRES_DB: aiqsa_knowledge_benchmark
      POSTGRES_PASSWORD: aiqsa-knowledge-benchmark-dev-password
      POSTGRES_USER: aiqsa_benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqsa_benchmark -d aiqsa_knowledge_benchmark"]
    ports: !override
      - "127.0.0.1:${AIQSA_KNOWLEDGE_BENCHMARK_POSTGRES_PORT:-15447}:5432"

  minio:
    container_name: aiqsa-knowledge-benchmark-second-minio
    ports: !override
      - "127.0.0.1:${AIQSA_KNOWLEDGE_BENCHMARK_MINIO_PORT:-19110}:9000"
      - "127.0.0.1:${AIQSA_KNOWLEDGE_BENCHMARK_MINIO_CONSOLE_PORT:-19111}:9001"

  minio-init:
    container_name: aiqsa-knowledge-benchmark-second-minio-init

  opensearch:
    ports: !override
      - "127.0.0.1:${AIQSA_KNOWLEDGE_BENCHMARK_OPENSEARCH_PORT:-19247}:9200"

networks:
  default:
    name: aiqsa-knowledge-benchmark-second-default
    ipam:
      config:
        - subnet: ${AIQSA_KNOWLEDGE_BENCHMARK_DEFAULT_SUBNET:-192.168.119.0/24}
  mcp-control:
    name: aiqsa-knowledge-benchmark-second-mcp-control
    internal: true
    ipam:
      config:
        - subnet: ${AIQSA_KNOWLEDGE_BENCHMARK_MCP_CONTROL_SUBNET:-192.168.120.0/24}
  parser-control:
    name: aiqsa-knowledge-benchmark-second-parser-control
    internal: true
    ipam:
      config:
        - subnet: ${AIQSA_KNOWLEDGE_BENCHMARK_PARSER_CONTROL_SUBNET:-192.168.121.0/24}
  search-control:
    name: aiqsa-knowledge-benchmark-second-search-control
    internal: true
    ipam:
      config:
        - subnet: ${AIQSA_KNOWLEDGE_BENCHMARK_SEARCH_CONTROL_SUBNET:-192.168.117.0/24}
  search-diagnostic:
    name: aiqsa-knowledge-benchmark-second-search-diagnostic
    ipam:
      config:
        - subnet: ${AIQSA_KNOWLEDGE_BENCHMARK_SEARCH_DIAGNOSTIC_SUBNET:-192.168.118.0/24}

volumes:
  minio_dev_data:
    name: aiqsa-knowledge-benchmark-second-minio
  opensearch_dev_data:
    name: aiqsa-knowledge-benchmark-second-opensearch
  postgres18_dev_data:
    name: aiqsa-knowledge-benchmark-second_postgres18_dev_data
