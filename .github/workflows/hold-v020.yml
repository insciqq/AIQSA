name: Hold v0.2.0 publication

on:
  push:
    branches: [main]
    paths: [.github/workflows/hold-v020.yml]

permissions: {}

# Cancel the earlier tag run while its production installation is prepared.
concurrency:
  group: release-refs/tags/v0.2.0
  cancel-in-progress: true

jobs:
  hold:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Publication paused for production installation verification.'
