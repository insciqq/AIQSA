name: Knowledge release quality

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: knowledge-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    name: Deterministic, privacy, and dependency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify public repository privacy
        run: npm run release:privacy:check

      - name: Check dependency advisories
        run: npm run security:deps

      - name: Run authoritative hermetic checks
        run: npm run check:hermetic

  migration-and-container:
    name: Migration and disposable container contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Start the disposable application topology
        run: docker compose -f docker-compose.dev.yml up -d --build --wait --wait-timeout 300 app

      - name: Verify migration contracts
        run: npm run db:migration:smoke

      - name: Discard migration-smoke state and writers
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

      - name: Start fresh disposable dependencies without application writers
        run: >-
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
          postgres minio

      - name: Initialize fresh disposable object storage
        run: >-
          docker compose -f docker-compose.dev.yml run --rm -T --no-deps
          minio-init

      - name: Run full disposable container checks
        run: npm run check:container

      - name: Remove disposable state
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  golden-corpus:
    name: Full Knowledge golden corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build the disposable app image
        run: docker compose -f docker-compose.dev.yml build app

      - name: Prepare aggregate report directory
        run: mkdir -p "${RUNNER_TEMP}/knowledge-golden"

      - name: Verify the reproducible 50-document corpus
        run: npm run test:knowledge:release-corpus

      - name: Evaluate ingestion release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:ingestion | tee "${RUNNER_TEMP}/knowledge-golden/ingestion.json"

      - name: Evaluate grounded answers
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:grounding | tee "${RUNNER_TEMP}/knowledge-golden/grounding.json"

      - name: Evaluate semantic grounding shadow report
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/knowledge-golden/semantic-grounding.json"
          npm run --silent eval:knowledge:semantic-grounding | tee "${report}"

      - name: Evaluate structured evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:structured | tee "${RUNNER_TEMP}/knowledge-golden/structured.json"

      - name: Evaluate visual evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:visual | tee "${RUNNER_TEMP}/knowledge-golden/visual.json"

      - name: Evaluate the current PostgreSQL baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:baseline | tee "${RUNNER_TEMP}/knowledge-golden/baseline.json"

      - name: Evaluate hierarchical indexes
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:indexes | tee "${RUNNER_TEMP}/knowledge-golden/indexes.json"

      - name: Evaluate adaptive retrieval and ranking
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:retrieval | tee "${RUNNER_TEMP}/knowledge-golden/retrieval.json"

      - name: Enforce semantic grounding release proof
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/knowledge-golden/semantic-grounding.json"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.semanticProof !== true || report.blockingEligible !== true || report.releaseGatePassed !== true) {
              throw new Error("semantic grounding release proof is not eligible or did not pass");
            }
          ' "${report}"

      - name: Upload aggregate golden reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-golden-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-golden
          if-no-files-found: warn
          retention-days: 30

      - name: Remove disposable state
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  sidecars:
    name: Parser sidecar integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Build the disposable app and parser images
        run: docker compose -f docker-compose.dev.yml build app docling

      - name: Start parser sidecars and readiness dependencies
        run: >-
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 900
          postgres minio docling tika

      - name: Initialize disposable object storage
        run: >-
          docker compose -f docker-compose.dev.yml run --rm -T --no-deps
          minio-init

      - name: Run parser and OCR smoke
        run: >-
          docker compose -f docker-compose.dev.yml run --rm -T --no-deps
          -e AIQSA_TEST_MODE=0
          -e AIQSA_LOCAL_DEV_PROFILE_DISABLED=1
          -e PLAYWRIGHT_TEST_AUTH=0
          app npm run smoke:parsers

      - name: Verify fallback and local degradation with stopped sidecars
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.dev.yml)
          restore_sidecars() {
            "${compose[@]}" start docling tika >/dev/null 2>&1 || true
          }
          trap restore_sidecars EXIT

          "${compose[@]}" stop docling
          "${compose[@]}" run --rm -T --no-deps \
            -e AIQSA_TEST_MODE=0 \
            -e AIQSA_LOCAL_DEV_PROFILE_DISABLED=1 \
            -e PLAYWRIGHT_TEST_AUTH=0 \
            -e AIQSA_PARSER_SMOKE_EXPECT_FALLBACK=1 \
            app npm run smoke:parsers

          "${compose[@]}" stop tika
          "${compose[@]}" run --rm -T --no-deps \
            -e AIQSA_TEST_MODE=0 \
            -e AIQSA_LOCAL_DEV_PROFILE_DISABLED=1 \
            -e PLAYWRIGHT_TEST_AUTH=0 \
            -e AIQSA_PARSER_SMOKE_EXPECT_UNAVAILABLE=1 \
            app npm run smoke:parsers

      - name: Remove disposable state
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  operations:
    name: Knowledge maintenance, cutover, and backup/restore
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify maintenance locking
        run: bash tests/ops-maintenance-lock.test.sh

      - name: Verify guarded Knowledge cutover
        run: bash tests/ops-knowledge-cutover.test.sh

      - name: Build disposable backup and restore tools
        run: docker compose -f docker-compose.dev.yml build app

      - name: Run unique-project backup and restore reconciliation
        env:
          AIQSA_TEST_TOOLS_IMAGE: aiqsa-dev-app:latest
        run: npm run test:backup-restore

      - name: Remove any disposable development state
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  browser:
    name: Knowledge browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Prepare browser artifact directory
        run: mkdir -p "${RUNNER_TEMP}/knowledge-playwright"

      - name: Build the disposable app and parser images
        run: docker compose -f docker-compose.dev.yml build app docling

      - name: Start disposable browser dependencies
        run: >-
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 900
          postgres minio docling tika

      - name: Initialize disposable object storage
        run: >-
          docker compose -f docker-compose.dev.yml run --rm -T --no-deps
          minio-init

      - name: Run ordinary browser workflows
        run: >-
          docker compose -f docker-compose.dev.yml run --rm -T --no-deps
          -v "${RUNNER_TEMP}/knowledge-playwright:/tmp/knowledge-playwright"
          -e AIQSA_PLAYWRIGHT_OUTPUT_DIR=/tmp/knowledge-playwright/ordinary
          app npm run test:e2e

      - name: Run the 50-document Knowledge browser journey
        run: >-
          docker compose -f docker-compose.dev.yml run --rm -T --no-deps
          -v "${RUNNER_TEMP}/knowledge-playwright:/tmp/knowledge-playwright"
          -e AIQSA_KNOWLEDGE_RELEASE_E2E=1
          -e AIQSA_PLAYWRIGHT_OUTPUT_DIR=/tmp/knowledge-playwright/release
          app npm run test:e2e:knowledge:release

      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-playwright
          if-no-files-found: warn
          retention-days: 7

      - name: Remove disposable state
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  performance:
    name: Knowledge profile and release-scale benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build the disposable app image
        run: docker compose -f docker-compose.dev.yml build app

      - name: Prepare aggregate benchmark directory
        run: mkdir -p "${RUNNER_TEMP}/knowledge-performance"

      - name: Compare supported Knowledge profiles
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:profiles | tee "${RUNNER_TEMP}/knowledge-performance/profiles.json"

      - name: Run the 500-Source release-scale gate
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent eval:knowledge:scale | tee "${RUNNER_TEMP}/knowledge-performance/scale.log"

      - name: Upload aggregate performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-performance
          if-no-files-found: warn
          retention-days: 30

      - name: Remove disposable state
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans
