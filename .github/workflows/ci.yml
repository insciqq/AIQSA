name: Hermetic checks

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: hermetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: Hermetic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run authoritative hermetic checks
        run: npm run check:hermetic

  knowledge-fast:
    name: Knowledge retrieval and grounding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run small deterministic retrieval fixtures
        run: >-
          npx vitest run
          tests/knowledge-evals/baseline.test.ts
          tests/knowledge-evals/planner.test.ts

      - name: Run deterministic grounding launch gate
        run: npm run eval:knowledge:grounding

      - name: Verify semantic grounding shadow contract
        run: npm run eval:knowledge:semantic-grounding
