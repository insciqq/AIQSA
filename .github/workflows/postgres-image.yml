name: Publish Postgres component

on:
  push:
    tags:
      - "postgres-16.14-pgvector0.8.5"

permissions: {}

concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: false

env:
  POSTGRES_IMAGE: ghcr.io/insciqq/aiqsa-postgres
  POSTGRES_COMPONENT_TAG: 16.14-pgvector0.8.5

jobs:
  prepare:
    name: Validate Postgres component publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out component tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify public repository privacy
        run: node scripts/release-privacy-check.mjs --ref HEAD --require-origin

      - name: Validate exact component tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="postgres-${POSTGRES_COMPONENT_TAG}"
          if [[ "${TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${TAG} does not match ${expected_tag}." >&2
            exit 1
          fi

  quality:
    name: Release technical gates
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/release-technical.yml

  build:
    name: Build Postgres ${{ matrix.platform }}
    needs:
      - prepare
      - quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - id: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out component tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish platform image by digest
        id: postgres_image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ops/postgres-pgvector.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.POSTGRES_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=postgres-release-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=postgres-release-${{ matrix.id }}

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.postgres_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid Postgres image digest." >&2
            exit 1
          fi
          digest_dir="${RUNNER_TEMP}/postgres-digests"
          mkdir -p "${digest_dir}"
          touch "${digest_dir}/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-digests-${{ matrix.id }}
          path: ${{ runner.temp }}/postgres-digests/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified Postgres manifest
    needs:
      - prepare
      - quality
      - build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: postgres-digests-*
          path: ${{ runner.temp }}/postgres-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-platform manifest
        id: postgres_manifest
        shell: bash
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/postgres-digests"
          shopt -s nullglob
          digest_files=("${digest_dir}"/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two Postgres platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Downloaded an invalid Postgres platform digest artifact." >&2
              exit 1
            fi
            sources+=("${POSTGRES_IMAGE}@sha256:${digest}")
          done

          component_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}"
          revision_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}-sha-${GITHUB_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${component_ref}" \
            --tag "${revision_ref}" \
            "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect --raw "${revision_ref}")"
          manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${revision_ref}" | jq -er '.digest')"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published Postgres manifest has an invalid digest." >&2
            exit 1
          fi

          component_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${component_ref}" | jq -er '.digest')"
          if [[ "${component_digest}" != "${manifest_digest}" ]]; then
            echo "Published Postgres tags do not resolve to one manifest digest." >&2
            exit 1
          fi

          mapfile -t platforms < <(
            jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
              <<< "${manifest_json}" | sort
          )
          expected_platforms=(linux/amd64 linux/arm64)
          if [[ "${platforms[*]}" != "${expected_platforms[*]}" ]]; then
            echo "Published Postgres manifest platforms are not exactly linux/amd64 and linux/arm64." >&2
            exit 1
          fi

          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Postgres component published"
            echo
            echo "- Tag: \`${component_ref}\`"
            echo "- Immutable reference: \`${POSTGRES_IMAGE}@${manifest_digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
