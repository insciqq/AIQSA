name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release-${{ contains(github.ref_name, '-rc.') && 'rc' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/insciqq/aiqsa
  POSTGRES_IMAGE: ghcr.io/insciqq/aiqsa-postgres
  POSTGRES_COMPONENT_TAG: 18.6-pgvector0.8.6

jobs:
  build:
    name: Build release images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish multi-platform images and GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Download Postgres platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: postgres-digests-*
          path: ${{ runner.temp }}/postgres-digests
          merge-multiple: true

      - name: Download component platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: component-digests-*
          path: ${{ runner.temp }}/component-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=rc,enable=${{ needs.build.outputs.is_rc == 'true' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=AIQSA
            org.opencontainers.image.description=Self-hosted multi-user AI workspace with multi-provider chat, MCP tools, and web search

      - name: Create and verify multi-platform manifest
        id: manifest
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_RC: ${{ needs.build.outputs.is_rc }}
        shell: bash
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          shopt -s nullglob
          digest_files=("${digest_dir}"/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Downloaded an invalid platform digest artifact." >&2
              exit 1
            fi
            sources+=("${IMAGE}@sha256:${digest}")
          done

          mapfile -t tags < <(jq -er '.tags[]' <<< "${METADATA_JSON}")
          if (( ${#tags[@]} == 0 )); then
            echo "Image metadata produced no publication tags." >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ "${tag}" != "${IMAGE}:"* ]]; then
              echo "Image metadata produced a tag outside the release repository." >&2
              exit 1
            fi
            if [[ "${VERSION}" == *-* && "${tag}" != "${IMAGE}:${VERSION}" &&
                  ! "${tag}" =~ :sha-[0-9a-f]{7}$ &&
                  ! ( "${IS_RC}" == "true" && "${tag}" == "${IMAGE}:rc" ) ]]; then
              echo "A prerelease must not update stable image tags." >&2
              exit 1
            fi
            tag_args+=(--tag "${tag}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          release_ref="${IMAGE}:${VERSION}"
          manifest_json="$(docker buildx imagetools inspect --raw "${release_ref}")"
          manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${release_ref}" | jq -er '.digest')"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published manifest has an invalid digest." >&2
            exit 1
          fi

          for tag in "${tags[@]}"; do
            tag_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${tag}" | jq -er '.digest')"
            if [[ "${tag_digest}" != "${manifest_digest}" ]]; then
              echo "Published image tags do not resolve to one manifest digest." >&2
              exit 1
            fi
          done

          mapfile -t platforms < <(
            jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
              <<< "${manifest_json}" | sort
          )
          expected_platforms=(linux/amd64 linux/arm64)
          if [[ "${platforms[*]}" != "${expected_platforms[*]}" ]]; then
            echo "Published manifest platforms are not exactly linux/amd64 and linux/arm64." >&2
            exit 1
          fi

          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Create and verify Postgres multi-platform manifest
        id: postgres_manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IS_RC: ${{ needs.build.outputs.is_rc }}
          REUSE_DIGEST: ${{ fromJSON(needs.build.outputs.reuse).postgres }}
        shell: bash
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/postgres-digests"
          shopt -s nullglob
          digest_files=("${digest_dir}"/*)
          expected=2
          if [[ -n "${REUSE_DIGEST}" ]]; then expected=1; fi
          if (( ${#digest_files[@]} != expected )); then
            echo "Expected ${expected} Postgres digest artifacts, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Downloaded an invalid Postgres platform digest artifact." >&2
              exit 1
            fi
            sources+=("${POSTGRES_IMAGE}@sha256:${digest}")
          done
          if [[ -n "${REUSE_DIGEST}" ]]; then
            [[ "${sources[0]}" == "${POSTGRES_IMAGE}@${REUSE_DIGEST}" ]]
          fi

          component_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}"
          release_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}-${VERSION}"
          postgres_tags=(--tag "${release_ref}")
          major_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG%%.*}"
          if [[ "${VERSION}" != *-* ]]; then
            postgres_tags+=(--tag "${component_ref}" --tag "${major_ref}")
          elif [[ "${IS_RC}" == "true" ]]; then
            postgres_tags+=(--tag "${POSTGRES_IMAGE}:rc")
          fi
          docker buildx imagetools create "${postgres_tags[@]}" "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect --raw "${release_ref}")"
          manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${release_ref}" | jq -er '.digest')"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published Postgres manifest has an invalid digest." >&2
            exit 1
          fi

          if [[ "${VERSION}" != *-* ]]; then
            component_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${component_ref}" | jq -er '.digest')"
            [[ "${component_digest}" == "${manifest_digest}" ]]
            major_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${major_ref}" | jq -er '.digest')"
            [[ "${major_digest}" == "${manifest_digest}" ]]
          elif [[ "${IS_RC}" == "true" ]]; then
            rc_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${POSTGRES_IMAGE}:rc" | jq -er '.digest')"
            [[ "${rc_digest}" == "${manifest_digest}" ]]
          fi

          mapfile -t platforms < <(
            jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
              <<< "${manifest_json}" | sort
          )
          expected_platforms=(linux/amd64 linux/arm64)
          if [[ "${platforms[*]}" != "${expected_platforms[*]}" ]]; then
            echo "Published Postgres manifest platforms are not exactly linux/amd64 and linux/arm64." >&2
            exit 1
          fi

          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish and verify component manifests
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IS_RC: ${{ needs.build.outputs.is_rc }}
          REUSE_IMAGES: ${{ needs.build.outputs.reuse }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          notes_file="${RUNNER_TEMP}/component-images.md"
          : > "${notes_file}"
          for component in docling tika opensearch workspace-runner; do
            digest_files=("${RUNNER_TEMP}/component-digests/${component}"/*)
            reuse_digest="$(jq -r --arg component "${component}" '.[$component] // ""' <<< "${REUSE_IMAGES}")"
            expected=2
            if [[ -n "${reuse_digest}" ]]; then expected=1; fi
            if (( ${#digest_files[@]} != expected )); then
              echo "Expected ${expected} digest artifacts for ${component}." >&2
              exit 1
            fi
            sources=()
            for digest_file in "${digest_files[@]}"; do
              digest="${digest_file##*/}"
              [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
              sources+=("${IMAGE}@sha256:${digest}")
            done
            if [[ -n "${reuse_digest}" ]]; then
              [[ "${sources[0]}" == "${IMAGE}@${reuse_digest}" ]]
            fi
            release_ref="${IMAGE}:${component}-${VERSION}"
            tags=(--tag "${release_ref}")
            if [[ "${VERSION}" != *-* ]]; then
              tags+=(--tag "${IMAGE}:${component}")
            elif [[ "${IS_RC}" == "true" ]]; then
              tags+=(--tag "${IMAGE}:${component}-rc")
            fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            manifest_json="$(docker buildx imagetools inspect --raw "${release_ref}")"
            manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${release_ref}" | jq -er '.digest')"
            [[ "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            platforms="$(jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' <<< "${manifest_json}" | sort)"
            [[ "${platforms}" == $'linux/amd64\nlinux/arm64' ]]
            if [[ "${VERSION}" != *-* ]]; then
              stable_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${component}" | jq -er '.digest')"
              [[ "${stable_digest}" == "${manifest_digest}" ]]
            elif [[ "${IS_RC}" == "true" ]]; then
              rc_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${component}-rc" | jq -er '.digest')"
              [[ "${rc_digest}" == "${manifest_digest}" ]]
            fi
            printf '%s image: %s\nImmutable digest: %s@%s\n\n' "${component}" "${release_ref}" "${IMAGE}" "${manifest_digest}" >> "${notes_file}"
          done

      - name: Create or update GitHub Release
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          POSTGRES_DIGEST: ${{ steps.postgres_manifest.outputs.digest }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_RC: ${{ needs.build.outputs.is_rc }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Docker image: ${IMAGE}:${VERSION}"$'\n'"Immutable digest: ${IMAGE}@${DIGEST}"$'\n\n'"Postgres image: ${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}-${VERSION}"$'\n'"Immutable Postgres digest: ${POSTGRES_IMAGE}@${POSTGRES_DIGEST}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "${notes}" > "${notes_file}"
          printf '\n' >> "${notes_file}"
          cat "${RUNNER_TEMP}/component-images.md" >> "${notes_file}"
          printf '\n' >> "${notes_file}"
          printf '%s\n\n' 'Published from the tag build. Full regression and installation checks run separately in Release full.' >> "${notes_file}"
          if [[ "${IS_RC}" == "true" ]]; then
            cat >> "${notes_file}" <<'RC_NOTES'
          To follow the RC channel, set these image overrides in your installation's `.env`, then run `docker compose pull && docker compose up -d`:

          ```dotenv
          AIQSA_IMAGE=ghcr.io/insciqq/aiqsa:rc
          AIQSA_POSTGRES_IMAGE=ghcr.io/insciqq/aiqsa-postgres:rc
          AIQSA_DOCLING_IMAGE=ghcr.io/insciqq/aiqsa:docling-rc
          AIQSA_TIKA_IMAGE=ghcr.io/insciqq/aiqsa:tika-rc
          AIQSA_OPENSEARCH_IMAGE=ghcr.io/insciqq/aiqsa:opensearch-rc
          AIQSA_WORKSPACE_RUNNER_IMAGE=ghcr.io/insciqq/aiqsa:workspace-runner-rc
          ```

          RC_NOTES
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${TAG}" --jq '.body' >> "${notes_file}"
          release_flags=(--verify-tag --title "AIQSA ${TAG}" --notes-file "${notes_file}")
          if [[ "${TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" "${release_flags[@]}"
          else
            gh release create "${TAG}" "${release_flags[@]}"
          fi
