name: Release

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - .github/workflows/release.yml
      - scripts/configure.sh
      - scripts/production-smoke.mjs
      - scripts/release-plan.mjs
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release-${{ contains(github.ref_name, '-rc.') && 'rc' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/insciqq/aiqsa
  POSTGRES_IMAGE: ghcr.io/insciqq/aiqsa-postgres
  POSTGRES_COMPONENT_TAG: 18.6-pgvector0.8.6

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      fast_rc: ${{ steps.release.outputs.fast_rc }}
      reuse: ${{ steps.release.outputs.reuse }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify public repository privacy
        run: node scripts/release-privacy-check.mjs --ref HEAD --require-origin

      - name: Validate version and select reusable infrastructure images
        id: release
        run: node scripts/release-plan.mjs

  quality:
    name: Release technical gates
    needs: prepare
    if: needs.prepare.outputs.fast_rc != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-technical.yml

  build:
    name: Build ${{ matrix.platform }}
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.quality.result == 'success' ||
           (needs.prepare.outputs.fast_rc == 'true' && needs.quality.result == 'skipped')) }}
    needs:
      - prepare
      - quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - id: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Free hosted runner disk for application and Workspace images
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=rc,enable=${{ needs.prepare.outputs.fast_rc == 'true' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=AIQSA
            org.opencontainers.image.description=Self-hosted multi-user AI workspace with multi-provider chat, MCP tools, and web search

      - name: Build and publish platform image by digest
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: release
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-workspace-${{ matrix.id }}
            type=gha,scope=release-${{ matrix.id }}
            type=gha
          cache-to: type=gha,mode=max,scope=release-${{ matrix.id }}

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid image digest." >&2
            exit 1
          fi
          digest_dir="${RUNNER_TEMP}/digests"
          mkdir -p "${digest_dir}"
          touch "${digest_dir}/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Build and publish Postgres platform image by digest
        if: ${{ !fromJSON(needs.prepare.outputs.reuse).postgres }}
        id: postgres_image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ops/postgres-pgvector.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.POSTGRES_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=postgres-release-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=postgres-release-${{ matrix.id }}

      - name: Export Postgres platform digest
        if: ${{ !fromJSON(needs.prepare.outputs.reuse).postgres || matrix.id == 'amd64' }}
        env:
          DIGEST: ${{ fromJSON(needs.prepare.outputs.reuse).postgres || steps.postgres_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid Postgres image digest." >&2
            exit 1
          fi
          digest_dir="${RUNNER_TEMP}/postgres-digests"
          mkdir -p "${digest_dir}"
          touch "${digest_dir}/${DIGEST#sha256:}"

      - name: Upload Postgres platform digest
        if: ${{ !fromJSON(needs.prepare.outputs.reuse).postgres || matrix.id == 'amd64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-digests-${{ matrix.id }}
          path: ${{ runner.temp }}/postgres-digests/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # This target extends release. Building it here shares the application
      # layers in the same builder instead of compiling AIQSA a second time.
      - name: Build and publish Workspace runner by digest
        id: workspace_image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: workspace-runner
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/insciqq/AIQSA
            org.opencontainers.image.title=AIQSA workspace-runner
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-workspace-${{ matrix.id }}
            type=gha,scope=workspace-runner-${{ matrix.id }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-workspace-${{ matrix.id }},mode=max,ignore-error=true

      - name: Export Workspace runner digest
        env:
          DIGEST: ${{ steps.workspace_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "${RUNNER_TEMP}/workspace-digests/workspace-runner"
          touch "${RUNNER_TEMP}/workspace-digests/workspace-runner/${DIGEST#sha256:}"

      - name: Upload Workspace runner digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-digests-workspace-runner-${{ matrix.id }}
          path: ${{ runner.temp }}/workspace-digests
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-components:
    name: Build ${{ matrix.component.name }} (${{ matrix.platform.name }})
    needs: [prepare, quality]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.quality.result == 'success' ||
           (needs.prepare.outputs.fast_rc == 'true' && needs.quality.result == 'skipped')) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: amd64
            name: linux/amd64
            runner: ubuntu-24.04
          - id: arm64
            name: linux/arm64
            runner: ubuntu-24.04-arm
        component:
          - name: docling
            context: ops/docling
            file: ops/docling/Dockerfile
            target: ""
          - name: tika
            context: ops/tika
            file: ops/tika/Dockerfile
            target: ""
          - name: opensearch
            context: ops/opensearch
            file: ops/opensearch/Dockerfile
            target: ""

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Free hosted runner disk for component images
        if: ${{ !fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] && runner.environment == 'github-hosted' }}
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up Docker Buildx
        if: ${{ !fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GHCR
        if: ${{ !fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build component by digest
        if: ${{ !fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] }}
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.file }}
          target: ${{ matrix.component.target }}
          platforms: ${{ matrix.platform.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/insciqq/AIQSA
            org.opencontainers.image.title=AIQSA ${{ matrix.component.name }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.platform.id }}
          cache-to: type=gha,mode=min,ignore-error=true,scope=${{ matrix.component.name }}-${{ matrix.platform.id }}

      - name: Export component digest
        if: ${{ !fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] || matrix.platform.id == 'amd64' }}
        env:
          DIGEST: ${{ fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] || steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.component.name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "${RUNNER_TEMP}/component-digests/${COMPONENT}"
          touch "${RUNNER_TEMP}/component-digests/${COMPONENT}/${DIGEST#sha256:}"

      - name: Upload component digest
        if: ${{ !fromJSON(needs.prepare.outputs.reuse)[matrix.component.name] || matrix.platform.id == 'amd64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-digests-${{ matrix.component.name }}-${{ matrix.platform.id }}
          path: ${{ runner.temp }}/component-digests
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  production-smoke:
    name: Production installation and update
    needs: [prepare, build, build-components]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.fast_rc != 'true' &&
          needs.build.result == 'success' && needs.build-components.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2

      - name: Free hosted runner disk for the full production stack
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download native image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-amd64"
          path: ${{ runner.temp }}/smoke-digests

      - name: Prepare exact image references
        shell: python
        run: |
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          images = {}
          for component in ["app", "postgres", "docling", "tika", "opensearch"]:
              artifact = {"app": "digests-amd64", "postgres": "postgres-digests-amd64"}.get(component, f"component-digests-{component}-amd64")
              files = [p for p in (root / "smoke-digests" / artifact).rglob("*") if p.is_file()]
              assert len(files) == 1 and re.fullmatch(r"[0-9a-f]{64}", files[0].name)
              repository = os.environ["POSTGRES_IMAGE"] if component == "postgres" else os.environ["IMAGE"]
              images[component] = f"{repository}@sha256:{files[0].name}"
          (root / "production-images.json").write_text(json.dumps(images))

      - name: Verify fresh installation and ordinary image updates
        run: node scripts/production-smoke.mjs --disposable "${RUNNER_TEMP}/production-images.json"

  publish:
    name: Publish multi-platform images and GitHub Release
    if: >-
      ${{ !cancelled() && github.ref_type == 'tag' && needs.prepare.result == 'success' &&
          needs.build.result == 'success' && needs.build-components.result == 'success' &&
          ((needs.quality.result == 'success' && needs.production-smoke.result == 'success') ||
           (needs.prepare.outputs.fast_rc == 'true' && needs.quality.result == 'skipped' &&
            needs.production-smoke.result == 'skipped')) }}
    needs:
      - prepare
      - quality
      - build
      - build-components
      - production-smoke
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Download Postgres platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: postgres-digests-*
          path: ${{ runner.temp }}/postgres-digests
          merge-multiple: true

      - name: Download component platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: component-digests-*
          path: ${{ runner.temp }}/component-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Sign in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=rc,enable=${{ needs.prepare.outputs.fast_rc == 'true' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=AIQSA
            org.opencontainers.image.description=Self-hosted multi-user AI workspace with multi-provider chat, MCP tools, and web search

      - name: Create and verify multi-platform manifest
        id: manifest
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FAST_RC: ${{ needs.prepare.outputs.fast_rc }}
        shell: bash
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          shopt -s nullglob
          digest_files=("${digest_dir}"/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Downloaded an invalid platform digest artifact." >&2
              exit 1
            fi
            sources+=("${IMAGE}@sha256:${digest}")
          done

          mapfile -t tags < <(jq -er '.tags[]' <<< "${METADATA_JSON}")
          if (( ${#tags[@]} == 0 )); then
            echo "Image metadata produced no publication tags." >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ "${tag}" != "${IMAGE}:"* ]]; then
              echo "Image metadata produced a tag outside the release repository." >&2
              exit 1
            fi
            if [[ "${VERSION}" == *-* && "${tag}" != "${IMAGE}:${VERSION}" &&
                  ! "${tag}" =~ :sha-[0-9a-f]{7}$ &&
                  ! ( "${FAST_RC}" == "true" && "${tag}" == "${IMAGE}:rc" ) ]]; then
              echo "A prerelease must not update stable image tags." >&2
              exit 1
            fi
            tag_args+=(--tag "${tag}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          release_ref="${IMAGE}:${VERSION}"
          manifest_json="$(docker buildx imagetools inspect --raw "${release_ref}")"
          manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${release_ref}" | jq -er '.digest')"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published manifest has an invalid digest." >&2
            exit 1
          fi

          for tag in "${tags[@]}"; do
            tag_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${tag}" | jq -er '.digest')"
            if [[ "${tag_digest}" != "${manifest_digest}" ]]; then
              echo "Published image tags do not resolve to one manifest digest." >&2
              exit 1
            fi
          done

          mapfile -t platforms < <(
            jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
              <<< "${manifest_json}" | sort
          )
          expected_platforms=(linux/amd64 linux/arm64)
          if [[ "${platforms[*]}" != "${expected_platforms[*]}" ]]; then
            echo "Published manifest platforms are not exactly linux/amd64 and linux/arm64." >&2
            exit 1
          fi

          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Create and verify Postgres multi-platform manifest
        id: postgres_manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FAST_RC: ${{ needs.prepare.outputs.fast_rc }}
          REUSE_DIGEST: ${{ fromJSON(needs.prepare.outputs.reuse).postgres }}
        shell: bash
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/postgres-digests"
          shopt -s nullglob
          digest_files=("${digest_dir}"/*)
          expected=2
          if [[ -n "${REUSE_DIGEST}" ]]; then expected=1; fi
          if (( ${#digest_files[@]} != expected )); then
            echo "Expected ${expected} Postgres digest artifacts, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Downloaded an invalid Postgres platform digest artifact." >&2
              exit 1
            fi
            sources+=("${POSTGRES_IMAGE}@sha256:${digest}")
          done
          if [[ -n "${REUSE_DIGEST}" ]]; then
            [[ "${sources[0]}" == "${POSTGRES_IMAGE}@${REUSE_DIGEST}" ]]
          fi

          component_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}"
          release_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}-${VERSION}"
          postgres_tags=(--tag "${release_ref}")
          major_ref="${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG%%.*}"
          if [[ "${VERSION}" != *-* ]]; then
            postgres_tags+=(--tag "${component_ref}" --tag "${major_ref}")
          elif [[ "${FAST_RC}" == "true" ]]; then
            postgres_tags+=(--tag "${POSTGRES_IMAGE}:rc")
          fi
          docker buildx imagetools create "${postgres_tags[@]}" "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect --raw "${release_ref}")"
          manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${release_ref}" | jq -er '.digest')"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published Postgres manifest has an invalid digest." >&2
            exit 1
          fi

          if [[ "${VERSION}" != *-* ]]; then
            component_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${component_ref}" | jq -er '.digest')"
            [[ "${component_digest}" == "${manifest_digest}" ]]
            major_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${major_ref}" | jq -er '.digest')"
            [[ "${major_digest}" == "${manifest_digest}" ]]
          elif [[ "${FAST_RC}" == "true" ]]; then
            rc_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${POSTGRES_IMAGE}:rc" | jq -er '.digest')"
            [[ "${rc_digest}" == "${manifest_digest}" ]]
          fi

          mapfile -t platforms < <(
            jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
              <<< "${manifest_json}" | sort
          )
          expected_platforms=(linux/amd64 linux/arm64)
          if [[ "${platforms[*]}" != "${expected_platforms[*]}" ]]; then
            echo "Published Postgres manifest platforms are not exactly linux/amd64 and linux/arm64." >&2
            exit 1
          fi

          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish and verify component manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FAST_RC: ${{ needs.prepare.outputs.fast_rc }}
          REUSE_IMAGES: ${{ needs.prepare.outputs.reuse }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          notes_file="${RUNNER_TEMP}/component-images.md"
          : > "${notes_file}"
          for component in docling tika opensearch workspace-runner; do
            digest_files=("${RUNNER_TEMP}/component-digests/${component}"/*)
            reuse_digest="$(jq -r --arg component "${component}" '.[$component] // ""' <<< "${REUSE_IMAGES}")"
            expected=2
            if [[ -n "${reuse_digest}" ]]; then expected=1; fi
            if (( ${#digest_files[@]} != expected )); then
              echo "Expected ${expected} digest artifacts for ${component}." >&2
              exit 1
            fi
            sources=()
            for digest_file in "${digest_files[@]}"; do
              digest="${digest_file##*/}"
              [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
              sources+=("${IMAGE}@sha256:${digest}")
            done
            if [[ -n "${reuse_digest}" ]]; then
              [[ "${sources[0]}" == "${IMAGE}@${reuse_digest}" ]]
            fi
            release_ref="${IMAGE}:${component}-${VERSION}"
            tags=(--tag "${release_ref}")
            if [[ "${VERSION}" != *-* ]]; then
              tags+=(--tag "${IMAGE}:${component}")
            elif [[ "${FAST_RC}" == "true" ]]; then
              tags+=(--tag "${IMAGE}:${component}-rc")
            fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            manifest_json="$(docker buildx imagetools inspect --raw "${release_ref}")"
            manifest_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${release_ref}" | jq -er '.digest')"
            [[ "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            platforms="$(jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' <<< "${manifest_json}" | sort)"
            [[ "${platforms}" == $'linux/amd64\nlinux/arm64' ]]
            if [[ "${VERSION}" != *-* ]]; then
              stable_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${component}" | jq -er '.digest')"
              [[ "${stable_digest}" == "${manifest_digest}" ]]
            elif [[ "${FAST_RC}" == "true" ]]; then
              rc_digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE}:${component}-rc" | jq -er '.digest')"
              [[ "${rc_digest}" == "${manifest_digest}" ]]
            fi
            printf '%s image: %s\nImmutable digest: %s@%s\n\n' "${component}" "${release_ref}" "${IMAGE}" "${manifest_digest}" >> "${notes_file}"
          done

      - name: Create or update GitHub Release
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          POSTGRES_DIGEST: ${{ steps.postgres_manifest.outputs.digest }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FAST_RC: ${{ needs.prepare.outputs.fast_rc }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Docker image: ${IMAGE}:${VERSION}"$'\n'"Immutable digest: ${IMAGE}@${DIGEST}"$'\n\n'"Postgres image: ${POSTGRES_IMAGE}:${POSTGRES_COMPONENT_TAG}-${VERSION}"$'\n'"Immutable Postgres digest: ${POSTGRES_IMAGE}@${POSTGRES_DIGEST}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "${notes}" > "${notes_file}"
          printf '\n' >> "${notes_file}"
          cat "${RUNNER_TEMP}/component-images.md" >> "${notes_file}"
          printf '\n' >> "${notes_file}"
          if [[ "${FAST_RC}" == "true" ]]; then
            cat >> "${notes_file}" <<'RC_NOTES'
          CI test suites and installation smoke tests are skipped for this release candidate.

          To follow the RC channel, set these image overrides in your installation's `.env`, then run `docker compose pull && docker compose up -d`:

          ```dotenv
          AIQSA_IMAGE=ghcr.io/insciqq/aiqsa:rc
          AIQSA_POSTGRES_IMAGE=ghcr.io/insciqq/aiqsa-postgres:rc
          AIQSA_DOCLING_IMAGE=ghcr.io/insciqq/aiqsa:docling-rc
          AIQSA_TIKA_IMAGE=ghcr.io/insciqq/aiqsa:tika-rc
          AIQSA_OPENSEARCH_IMAGE=ghcr.io/insciqq/aiqsa:opensearch-rc
          AIQSA_WORKSPACE_RUNNER_IMAGE=ghcr.io/insciqq/aiqsa:workspace-runner-rc
          ```

          RC_NOTES
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${TAG}" --jq '.body' >> "${notes_file}"
          release_flags=(--verify-tag --title "AIQSA ${TAG}" --notes-file "${notes_file}")
          if [[ "${TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" "${release_flags[@]}"
          else
            gh release create "${TAG}" "${release_flags[@]}"
          fi
