name: aiqsa

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "${AIQSA_LOG_MAX_FILES:-5}"
    max-size: "${AIQSA_LOG_MAX_SIZE:-10m}"

services:
  app:
    image: ${AIQSA_IMAGE:-ghcr.io/insciqq/aiqsa:latest}
    environment:
      AIQSA_APP_BASE_URL: ${AIQSA_APP_BASE_URL:-http://localhost:3000}
      AIQSA_AUTH_SESSION_SECRET: ${AIQSA_AUTH_SESSION_SECRET:?Set AIQSA_AUTH_SESSION_SECRET in .env}
      AIQSA_BIND_ADDRESS: ${AIQSA_BIND_ADDRESS:-127.0.0.1}
      AIQSA_BOOTSTRAP_AUTH_TOKEN: ${AIQSA_BOOTSTRAP_AUTH_TOKEN:-}
      AIQSA_BOOTSTRAP_AUTH_TOKEN_SHA256: ${AIQSA_BOOTSTRAP_AUTH_TOKEN_SHA256:-}
      AIQSA_BOOTSTRAP_LOGIN_ENABLED: ${AIQSA_BOOTSTRAP_LOGIN_ENABLED:-}
      AIQSA_BOOTSTRAP_USER_ID: ${AIQSA_BOOTSTRAP_USER_ID:-}
      AIQSA_COOKIE_SECURE: ${AIQSA_COOKIE_SECURE:-}
      AIQSA_ENCRYPTION_KEY: ${AIQSA_ENCRYPTION_KEY:?Set AIQSA_ENCRYPTION_KEY in .env}
      AIQSA_MEMORY_EGRESS_CONSENT_MODE: ${AIQSA_MEMORY_EGRESS_CONSENT_MODE:-ADMIN}
      AIQSA_MEMORY_FINGERPRINT_KEYRING: ${AIQSA_MEMORY_FINGERPRINT_KEYRING:?Set AIQSA_MEMORY_FINGERPRINT_KEYRING in .env}
      AIQSA_GOOGLE_OAUTH_CLIENT_ID: ${AIQSA_GOOGLE_OAUTH_CLIENT_ID:-}
      AIQSA_GOOGLE_OAUTH_CLIENT_SECRET: ${AIQSA_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # OpenAI background polling has a separate lifecycle window; each HTTP
      # exchange still uses the response deadline configured in Admin.
      AIQSA_OPENAI_BACKGROUND_POLL_TIMEOUT_MS: ${AIQSA_OPENAI_BACKGROUND_POLL_TIMEOUT_MS:-660000}
      # Deprecated timing values are forwarded only for the value-free startup warning.
      # Provider execution ignores them; configure response deadlines in Admin.
      AIQSA_PROVIDER_STREAM_IDLE_TIMEOUT_MS: ${AIQSA_PROVIDER_STREAM_IDLE_TIMEOUT_MS:-}
      AIQSA_PROVIDER_STREAM_MAX_DURATION_MS: ${AIQSA_PROVIDER_STREAM_MAX_DURATION_MS:-}
      AIQSA_PROVIDER_TIMEOUT_MS: ${AIQSA_PROVIDER_TIMEOUT_MS:-}
      AIQSA_PROVIDER_RESPONSE_MAX_BYTES: ${AIQSA_PROVIDER_RESPONSE_MAX_BYTES:-}
      AIQSA_PROVIDER_STREAM_MAX_EVENT_BYTES: ${AIQSA_PROVIDER_STREAM_MAX_EVENT_BYTES:-}
      AIQSA_PROVIDER_STREAM_MAX_BYTES: ${AIQSA_PROVIDER_STREAM_MAX_BYTES:-}
      AIQSA_PROVIDER_STREAM_MAX_OUTPUT_CHARS: ${AIQSA_PROVIDER_STREAM_MAX_OUTPUT_CHARS:-}
      AIQSA_MCP_INITIALIZE_RESPONSE_MAX_BYTES: ${AIQSA_MCP_INITIALIZE_RESPONSE_MAX_BYTES:-1048576}
      AIQSA_MCP_LIST_TOOLS_RESPONSE_MAX_BYTES: ${AIQSA_MCP_LIST_TOOLS_RESPONSE_MAX_BYTES:-16777216}
      AIQSA_MCP_CALL_TOOL_RESPONSE_MAX_BYTES: ${AIQSA_MCP_CALL_TOOL_RESPONSE_MAX_BYTES:-524288}
      AIQSA_MCP_UNKNOWN_RESPONSE_MAX_BYTES: ${AIQSA_MCP_UNKNOWN_RESPONSE_MAX_BYTES:-1048576}
      AIQSA_MCP_SSE_EVENT_MAX_BYTES: ${AIQSA_MCP_SSE_EVENT_MAX_BYTES:-16777216}
      AIQSA_SMTP_COMMAND_TIMEOUT_MS: ${AIQSA_SMTP_COMMAND_TIMEOUT_MS:-15000}
      AIQSA_SMTP_CONNECT_TIMEOUT_MS: ${AIQSA_SMTP_CONNECT_TIMEOUT_MS:-10000}
      AIQSA_SMTP_TOTAL_TIMEOUT_MS: ${AIQSA_SMTP_TOTAL_TIMEOUT_MS:-60000}
      AIQSA_TRUST_PROXY_HEADERS: ${AIQSA_TRUST_PROXY_HEADERS:-}
      AIQSA_TRUSTED_PROXY_COUNT: ${AIQSA_TRUSTED_PROXY_COUNT:-}
      AIQSA_TOOLHIVE_URL: http://toolhive-runtime:8080
      AIQSA_AUTH_REQUEST_BODY_MAX_BYTES: ${AIQSA_AUTH_REQUEST_BODY_MAX_BYTES:-65536}
      AIQSA_JSON_REQUEST_BODY_MAX_BYTES: ${AIQSA_JSON_REQUEST_BODY_MAX_BYTES:-1048576}
      AIQSA_ATTACHMENT_EXTRACTED_TEXT_MAX_CHARS: ${AIQSA_ATTACHMENT_EXTRACTED_TEXT_MAX_CHARS:-1000000}
      AIQSA_KNOWLEDGE_MAX_FILE_BYTES: ${AIQSA_KNOWLEDGE_MAX_FILE_BYTES:-50000000}
      AIQSA_KNOWLEDGE_MAX_PAGES: ${AIQSA_KNOWLEDGE_MAX_PAGES:-2000}
      AIQSA_KNOWLEDGE_MAX_NORMALIZED_CHARS: ${AIQSA_KNOWLEDGE_MAX_NORMALIZED_CHARS:-5000000}
      AIQSA_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT: ${AIQSA_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT:-10000}
      AIQSA_PDF_EXTRACTION_TIMEOUT_MS: ${AIQSA_PDF_EXTRACTION_TIMEOUT_MS:-20000}
      AIQSA_PDF_MAX_PAGES: ${AIQSA_PDF_MAX_PAGES:-500}
      AIQSA_DOCLING_REQUEST_MAX_BYTES: ${AIQSA_DOCLING_REQUEST_MAX_BYTES:-}
      AIQSA_DOCLING_RESPONSE_MAX_BYTES: ${AIQSA_DOCLING_RESPONSE_MAX_BYTES:-33554432}
      AIQSA_DOCLING_TIMEOUT_MS: ${AIQSA_DOCLING_TIMEOUT_MS:-300000}
      AIQSA_DOCLING_URL: http://docling:5001
      AIQSA_TIKA_REQUEST_MAX_BYTES: ${AIQSA_TIKA_REQUEST_MAX_BYTES:-}
      AIQSA_TIKA_RESPONSE_MAX_BYTES: ${AIQSA_TIKA_RESPONSE_MAX_BYTES:-16777216}
      AIQSA_TIKA_TIMEOUT_MS: ${AIQSA_TIKA_TIMEOUT_MS:-120000}
      AIQSA_TIKA_URL: http://tika:9998
      AIQSA_RUN_ATTACHMENT_MAX_COUNT: ${AIQSA_RUN_ATTACHMENT_MAX_COUNT:-20}
      AIQSA_RUN_ATTACHMENT_MAX_ENCODED_BYTES: ${AIQSA_RUN_ATTACHMENT_MAX_ENCODED_BYTES:-100663296}
      AIQSA_RUN_ATTACHMENT_MAX_MATERIALIZED_BYTES: ${AIQSA_RUN_ATTACHMENT_MAX_MATERIALIZED_BYTES:-67108864}
      AIQSA_RUN_ATTACHMENT_READ_CONCURRENCY: ${AIQSA_RUN_ATTACHMENT_READ_CONCURRENCY:-2}
      AIQSA_UPLOAD_MAX_BYTES: ${AIQSA_UPLOAD_MAX_BYTES:-25000000}
      AIQSA_UPLOAD_MAX_CONCURRENCY: ${AIQSA_UPLOAD_MAX_CONCURRENCY:-4}
      AIQSA_UPLOAD_MULTIPART_OVERHEAD_BYTES: ${AIQSA_UPLOAD_MULTIPART_OVERHEAD_BYTES:-1048576}
      AIQSA_UPLOAD_STORAGE_DIR: ${AIQSA_UPLOAD_STORAGE_DIR:-}
      AIQSA_YANDEX_OAUTH_CLIENT_ID: ${AIQSA_YANDEX_OAUTH_CLIENT_ID:-}
      AIQSA_YANDEX_OAUTH_CLIENT_SECRET: ${AIQSA_YANDEX_OAUTH_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://${AIQSA_POSTGRES_USER:-aiqsa}:${AIQSA_POSTGRES_PASSWORD:?Set AIQSA_POSTGRES_PASSWORD in .env}@postgres:5432/${AIQSA_POSTGRES_DB:-aiqsa}?schema=public
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      S3_ACCESS_KEY_ID: ${AIQSA_S3_ACCESS_KEY_ID:-aiqsa}
      S3_BUCKET: ${AIQSA_S3_BUCKET:-aiqsa-uploads}
      S3_ENDPOINT: ${AIQSA_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${AIQSA_S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${AIQSA_S3_SECRET_ACCESS_KEY:?Set AIQSA_S3_SECRET_ACCESS_KEY in .env}
    cpus: ${AIQSA_APP_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    init: true
    logging: *default-logging
    mem_limit: ${AIQSA_APP_MEMORY_LIMIT:-2g}
    networks:
      - default
      - mcp-control
      - parser-control
    ports:
      - "${AIQSA_BIND_ADDRESS:-127.0.0.1}:${AIQSA_PORT:-3000}:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  memory-worker:
    image: ${AIQSA_IMAGE:-ghcr.io/insciqq/aiqsa:latest}
    command: ["npm", "run", "memory:coordinator"]
    environment:
      AIQSA_MEMORY_EGRESS_CONSENT_MODE: ${AIQSA_MEMORY_EGRESS_CONSENT_MODE:-ADMIN}
      AIQSA_MEMORY_FINGERPRINT_KEYRING: ${AIQSA_MEMORY_FINGERPRINT_KEYRING:?Set AIQSA_MEMORY_FINGERPRINT_KEYRING in .env}
      DATABASE_URL: postgresql://${AIQSA_POSTGRES_USER:-aiqsa}:${AIQSA_POSTGRES_PASSWORD:?Set AIQSA_POSTGRES_PASSWORD in .env}@postgres:5432/${AIQSA_POSTGRES_DB:-aiqsa}?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    cpus: ${AIQSA_MEMORY_WORKER_CPU_LIMIT:-1.0}
    init: true
    logging: *default-logging
    mem_limit: ${AIQSA_MEMORY_WORKER_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  docling:
    build:
      context: ./ops/docling
    image: aiqsa-docling:v1.21.0-easyocr-ru-en-1
    pull_policy: build
    cap_drop:
      - ALL
    cpus: ${AIQSA_DOCLING_CPU_LIMIT:-2.0}
    environment:
      DOCLING_NUM_THREADS: "2"
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LAYOUT_BATCH_SIZE: "4"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "290"
      DOCLING_SERVE_OCR_BATCH_SIZE: "4"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_QUEUE_MAX_SIZE: "4"
      DOCLING_SERVE_TABLE_BATCH_SIZE: "4"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read(1024)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    init: true
    logging: *default-logging
    mem_limit: ${AIQSA_DOCLING_MEMORY_LIMIT:-10g}
    networks:
      - parser-control
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g

  tika:
    image: apache/tika:3.3.0.0-full@sha256:ecdd37e204308266b1f8e28569f8516ebd5b96d7a4518a71d3904710b20c03b3
    cap_drop:
      - ALL
    cpus: ${AIQSA_TIKA_CPU_LIMIT:-1.0}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    init: true
    logging: *default-logging
    mem_limit: ${AIQSA_TIKA_MEMORY_LIMIT:-1g}
    networks:
      - parser-control
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m

  toolhive-runtime:
    image: ghcr.io/stacklok/toolhive:v0.40.1@sha256:677dff9d73b33681f3d2c9b3c0b187e3210dc5ca3b8b326590d8db975f155578
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    cap_drop:
      - ALL
    environment:
      HOME: /var/lib/toolhive
      XDG_CACHE_HOME: /var/lib/toolhive/cache
      XDG_CONFIG_HOME: /var/lib/toolhive/config
      XDG_DATA_HOME: /var/lib/toolhive/data
      XDG_STATE_HOME: /var/lib/toolhive/state
    init: true
    logging: *default-logging
    networks:
      - mcp-control
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - toolhive_data:/var/lib/toolhive

  migrate-bootstrap:
    image: ${AIQSA_IMAGE:-ghcr.io/insciqq/aiqsa:latest}
    environment:
      AIQSA_ENCRYPTION_KEY: ${AIQSA_ENCRYPTION_KEY:?Set AIQSA_ENCRYPTION_KEY in .env}
      AIQSA_MEMORY_FINGERPRINT_KEYRING: ${AIQSA_MEMORY_FINGERPRINT_KEYRING:?Set AIQSA_MEMORY_FINGERPRINT_KEYRING in .env}
      AIQSA_INITIAL_ADMIN_DISPLAY_NAME: ${AIQSA_INITIAL_ADMIN_DISPLAY_NAME:-Administrator}
      AIQSA_INITIAL_ADMIN_EMAIL: ${AIQSA_INITIAL_ADMIN_EMAIL:?Set AIQSA_INITIAL_ADMIN_EMAIL in .env}
      AIQSA_INITIAL_ADMIN_PASSWORD: ${AIQSA_INITIAL_ADMIN_PASSWORD:-}
      AIQSA_INITIAL_ADMIN_USER_ID: ${AIQSA_INITIAL_ADMIN_USER_ID:-}
      AIQSA_SMTP_FROM: ${AIQSA_SMTP_FROM:-}
      AIQSA_SMTP_HOST: ${AIQSA_SMTP_HOST:-}
      AIQSA_SMTP_PASSWORD: ${AIQSA_SMTP_PASSWORD:-}
      AIQSA_SMTP_PORT: ${AIQSA_SMTP_PORT:-}
      AIQSA_SMTP_SECURE: ${AIQSA_SMTP_SECURE:-}
      AIQSA_SMTP_STARTTLS: ${AIQSA_SMTP_STARTTLS:-}
      AIQSA_SMTP_USER: ${AIQSA_SMTP_USER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      DATABASE_URL: postgresql://${AIQSA_POSTGRES_USER:-aiqsa}:${AIQSA_POSTGRES_PASSWORD:?Set AIQSA_POSTGRES_PASSWORD in .env}@postgres:5432/${AIQSA_POSTGRES_DB:-aiqsa}?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      S3_ACCESS_KEY_ID: ${AIQSA_S3_ACCESS_KEY_ID:-aiqsa}
      S3_BUCKET: ${AIQSA_S3_BUCKET:-aiqsa-uploads}
      S3_ENDPOINT: ${AIQSA_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${AIQSA_S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${AIQSA_S3_SECRET_ACCESS_KEY:?Set AIQSA_S3_SECRET_ACCESS_KEY in .env}
    command: ["sh", "-c", "npm run db:migrate:deploy && npm run db:bootstrap && npm run db:cutover"]
    cpus: ${AIQSA_TOOLS_CPU_LIMIT:-1.0}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging: *default-logging
    mem_limit: ${AIQSA_TOOLS_MEMORY_LIMIT:-1g}
    restart: "no"

  mcp-maintenance:
    profiles:
      - maintenance
    image: ${AIQSA_IMAGE:-ghcr.io/insciqq/aiqsa:latest}
    entrypoint: ["npm", "run", "mcp:cleanup", "--"]
    command: []
    environment:
      AIQSA_ENCRYPTION_KEY: ${AIQSA_ENCRYPTION_KEY:?Set AIQSA_ENCRYPTION_KEY in .env}
      AIQSA_TOOLHIVE_URL: http://toolhive-runtime:8080
    depends_on:
      - toolhive-runtime
    init: true
    networks:
      - mcp-control
    restart: "no"

  postgres:
    image: ghcr.io/insciqq/aiqsa-postgres:16.14-pgvector0.8.5@sha256:db8f80686e188be2abf9507d6a20d1cb230d47b1a4c8334cc7f076610b1d20ee
    environment:
      POSTGRES_DB: ${AIQSA_POSTGRES_DB:-aiqsa}
      POSTGRES_PASSWORD: ${AIQSA_POSTGRES_PASSWORD:?Set AIQSA_POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${AIQSA_POSTGRES_USER:-aiqsa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: ${AIQSA_POSTGRES_CPU_LIMIT:-1.0}
    logging: *default-logging
    mem_limit: ${AIQSA_POSTGRES_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${AIQSA_S3_SECRET_ACCESS_KEY:?Set AIQSA_S3_SECRET_ACCESS_KEY in .env}
      MINIO_ROOT_USER: ${AIQSA_S3_ACCESS_KEY_ID:-aiqsa}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: ${AIQSA_MINIO_CPU_LIMIT:-1.0}
    logging: *default-logging
    mem_limit: ${AIQSA_MINIO_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set private "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY_ID: ${AIQSA_S3_ACCESS_KEY_ID:-aiqsa}
      S3_BUCKET: ${AIQSA_S3_BUCKET:-aiqsa-uploads}
      S3_ENDPOINT: ${AIQSA_S3_ENDPOINT:-http://minio:9000}
      S3_SECRET_ACCESS_KEY: ${AIQSA_S3_SECRET_ACCESS_KEY:?Set AIQSA_S3_SECRET_ACCESS_KEY in .env}
    logging: *default-logging
    restart: "no"

networks:
  mcp-control:
    internal: true
  parser-control:
    internal: true

volumes:
  minio_data:
    name: ${AIQSA_MINIO_VOLUME_NAME:-aiqsa_minio_data}
  postgres_data:
    name: ${AIQSA_POSTGRES_VOLUME_NAME:-aiqsa_postgres_data}
  toolhive_data:
    name: ${AIQSA_TOOLHIVE_VOLUME_NAME:-aiqsa_toolhive_data}
